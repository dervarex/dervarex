<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a10"/>
      <stop offset="100%" stop-color="#16281a"/>
    </linearGradient>

    <!-- green glow behind the title -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>

    <!-- flower shape -->
    <g id="flower">
      <circle cx="0"  cy="-4" r="2.2" />
      <circle cx="3.8" cy="-1.2" r="2.2" />
      <circle cx="2.4" cy="3.2" r="2.2" />
      <circle cx="-2.4" cy="3.2" r="2.2" />
      <circle cx="-3.8" cy="-1.2" r="2.2" />
      <circle cx="0"  cy="0" r="1.4" fill="#ffd166" />
    </g>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #a7f3a0; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #a3b8a8; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #a3b8a8; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #ff9ec4; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #a3b8a8; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #ff9ec4; }
    .divider { stroke: #21371f; stroke-width: 1; }
  </style>

  <!-- card background -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#3fb950" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- glow overlay -->
  <rect width="800" height="120" fill="url(#glow)"/>

  <!-- grass on the bottom -->
  <path d="M40,240 Q44,220 38,200" stroke="#3fb950" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M60,240 Q56,215 64,195" stroke="#7ee787" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M740,240 Q744,215 738,192" stroke="#3fb950" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M760,240 Q756,218 764,198" stroke="#7ee787" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- pink cherry blossom flowers -->
  <use href="#flower" fill="#ff9ec4" opacity="0.85" transform="translate(120 46)"/>
  <use href="#flower" fill="#ffb3d1" opacity="0.75" transform="translate(300 34) scale(0.9)"/>
  <use href="#flower" fill="#ff9ec4" opacity="0.85" transform="translate(500 50) scale(1.1)"/>
  <use href="#flower" fill="#ffb3d1" opacity="0.75" transform="translate(680 38) scale(0.85)"/>
  <use href="#flower" fill="#ff9ec4" opacity="0.7"  transform="translate(220 66) scale(0.7)"/>
  <use href="#flower" fill="#ffb3d1" opacity="0.7"  transform="translate(580 72) scale(0.75)"/>

  <!-- leaves between flowers -->
  <ellipse cx="200" cy="50" rx="3" ry="1.5" fill="#7ee787" opacity="0.6" transform="rotate(30 200 50)"/>
  <ellipse cx="420" cy="40" rx="3" ry="1.5" fill="#3fb950" opacity="0.5" transform="rotate(-25 420 40)"/>
  <ellipse cx="640" cy="58" rx="3" ry="1.5" fill="#7ee787" opacity="0.6" transform="rotate(15 640 58)"/>
  <ellipse cx="80"  cy="80" rx="3" ry="1.5" fill="#3fb950" opacity="0.5" transform="rotate(-40 80 80)"/>
  <ellipse cx="720" cy="86" rx="3" ry="1.5" fill="#7ee787" opacity="0.5" transform="rotate(45 720 86)"/>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <!-- left column -->
  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">358</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">127h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">353</text>
  </g>

  <!-- right column -->
  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>
