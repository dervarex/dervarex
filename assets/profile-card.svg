<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0612"/>
      <stop offset="40%" stop-color="#1a0e14"/>
      <stop offset="75%" stop-color="#3a1420"/>
      <stop offset="100%" stop-color="#5a1e2a"/>
    </linearGradient>

    <!-- sun -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe0b8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffb199" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4d8a" stop-opacity="0"/>
    </radialGradient>

    <!-- horizon glow -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b5a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.45"/>
    </linearGradient>

    <!-- hill gradients -->
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1420"/>
      <stop offset="100%" stop-color="#1a0a12"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0810"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </linearGradient>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #ffb199; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a1a1; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a1a1; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #ffb199; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c9a1a1; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #ffb199; }
    .divider { stroke: #3a1a26; stroke-width: 1; }
  </style>

  <!-- card background -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#ff7b5a" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- sunset sun -->
  <circle cx="700" cy="70" r="70" fill="url(#sun)" opacity="0.7"/>
  <circle cx="700" cy="70" r="38" fill="url(#sun)"/>
  <circle cx="700" cy="70" r="18" fill="#ffe0b8" opacity="0.95"/>

  <!-- fake clouds, look like real ones because they're layered them here -->
  <g opacity="0.5">
    <ellipse cx="180" cy="36" rx="90" ry="4" fill="#ff7b5a"/>
    <ellipse cx="150" cy="32" rx="55" ry="3" fill="#ffb199"/>
    <ellipse cx="240" cy="40" rx="40" ry="2.5" fill="#ffb199"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="480" cy="28" rx="110" ry="4" fill="#ff7b5a"/>
    <ellipse cx="450" cy="24" rx="70" ry="3" fill="#ffb199"/>
    <ellipse cx="560" cy="32" rx="50" ry="2.5" fill="#ffb199"/>
  </g>
  <g opacity="0.35">
    <ellipse cx="120" cy="86" rx="100" ry="3.5" fill="#ff7b5a"/>
    <ellipse cx="320" cy="90" rx="80" ry="3" fill="#ffb199"/>
  </g>

  <!-- birds -->
  <path d="M140,66 Q146,60 152,66 Q158,60 164,66" stroke="#c9a1a1" stroke-width="1.2" fill="none" opacity="0.65"/>
  <path d="M190,84 Q195,79 200,84 Q205,79 210,84" stroke="#c9a1a1" stroke-width="1.1" fill="none" opacity="0.55"/>
  <path d="M110,52 Q114,48 118,52 Q122,48 126,52" stroke="#c9a1a1" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M235,64 Q239,60 243,64 Q247,60 251,64" stroke="#c9a1a1" stroke-width="1" fill="none" opacity="0.45"/>

  <!-- horizon glow -->
  <rect x="0" y="180" width="800" height="60" fill="url(#horizon)"/>

  <!-- back hills -->
  <path d="M0,215 Q80,198 160,206 T320,202 T480,208 T640,200 T800,210 L800,240 L0,240 Z"
        fill="url(#hillBack)" opacity="0.95"/>

  <!-- front hills -->
  <path d="M0,228 Q100,218 200,224 T400,220 T600,226 T800,222 L800,240 L0,240 Z"
        fill="url(#hillFront)"/>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <!-- left column -->
  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">377</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">128h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">372</text>
  </g>

  <!-- right column -->
  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>
