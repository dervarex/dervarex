<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="70%" stop-color="#101c2a"/>
      <stop offset="100%" stop-color="#1a2c40"/>
    </linearGradient>

    <!-- soft blue glow behind the title -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8ecae6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8ecae6" stop-opacity="0"/>
    </radialGradient>

    <!-- moon -->
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f6fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8ecae6" stop-opacity="0"/>
    </radialGradient>

    <!-- snowflake shape -->
    <g id="snowflake" stroke-linecap="round">
      <line x1="0" y1="-4" x2="0" y2="4"/>
      <line x1="-3.5" y1="-2" x2="3.5" y2="2"/>
      <line x1="-3.5" y1="2" x2="3.5" y2="-2"/>
    </g>

    <!-- snow ground gradient -->
    <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f2fa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8ecae6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #c9e4f0; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #8fa9ba; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #8fa9ba; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #8ecae6; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #8fa9ba; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #8ecae6; }
    .divider { stroke: #1c2c3c; stroke-width: 1; }
  </style>

  <!-- card background -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#8ecae6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- glow overlay -->
  <rect width="800" height="120" fill="url(#glow)"/>

  <!-- moon top right -->
  <circle cx="720" cy="50" r="42" fill="url(#moon)" opacity="0.7"/>
  <circle cx="720" cy="50" r="18" fill="#f0f6fc" opacity="0.9"/>
  <circle cx="715" cy="46" r="3" fill="#c9e4f0" opacity="0.5"/>
  <circle cx="726" cy="54" r="2.2" fill="#c9e4f0" opacity="0.4"/>

  <!-- small stars -->
  <circle cx="80"  cy="28" r="1" fill="#c9e4f0" opacity="0.7"/>
  <circle cx="180" cy="20" r="0.8" fill="#c9e4f0" opacity="0.5"/>
  <circle cx="300" cy="30" r="1" fill="#c9e4f0" opacity="0.6"/>
  <circle cx="420" cy="22" r="0.8" fill="#c9e4f0" opacity="0.5"/>
  <circle cx="540" cy="32" r="1.1" fill="#c9e4f0" opacity="0.6"/>
  <circle cx="640" cy="18" r="0.8" fill="#c9e4f0" opacity="0.4"/>
  <circle cx="760" cy="110" r="0.9" fill="#c9e4f0" opacity="0.5"/>

  <!-- snowflakes -->
  <g stroke="#e6f2fa" stroke-width="0.9" fill="none">
    <use href="#snowflake" opacity="0.7" transform="translate(60 55)"/>
    <use href="#snowflake" opacity="0.5" transform="translate(150 90) scale(0.8)"/>
    <use href="#snowflake" opacity="0.6" transform="translate(240 40) scale(1.1)"/>
    <use href="#snowflake" opacity="0.45" transform="translate(340 70)"/>
    <use href="#snowflake" opacity="0.7" transform="translate(420 95) scale(0.9)"/>
    <use href="#snowflake" opacity="0.55" transform="translate(500 45) scale(1.2)"/>
    <use href="#snowflake" opacity="0.4" transform="translate(580 80) scale(0.85)"/>
    <use href="#snowflake" opacity="0.6" transform="translate(660 60) scale(1)"/>
    <use href="#snowflake" opacity="0.5" transform="translate(100 130) scale(0.9)"/>
    <use href="#snowflake" opacity="0.45" transform="translate(300 140) scale(0.8)"/>
    <use href="#snowflake" opacity="0.5" transform="translate(520 130) scale(1)"/>
    <use href="#snowflake" opacity="0.55" transform="translate(740 140) scale(0.9)"/>
  </g>

  <!-- tiny snow dots-->
  <g fill="#e6f2fa">
    <circle cx="200" cy="60" r="1" opacity="0.5"/>
    <circle cx="380" cy="50" r="0.8" opacity="0.45"/>
    <circle cx="470" cy="80" r="1" opacity="0.5"/>
    <circle cx="620" cy="90" r="0.8" opacity="0.4"/>
    <circle cx="80"  cy="105" r="1" opacity="0.45"/>
    <circle cx="700" cy="120" r="0.9" opacity="0.4"/>
  </g>

  <!-- snow covered hills -->
  <path d="M0,220 Q100,208 200,216 T400,212 T600,218 T800,210 L800,240 L0,240 Z"
        fill="url(#snowGround)" opacity="0.55"/>
  <path d="M0,232 Q120,224 240,230 T480,228 T720,230 L800,228 L800,240 L0,240 Z"
        fill="#e6f2fa" opacity="0.75"/>

  <!-- snowman -->
  <g transform="translate(660 218)">
    <!-- bottom ball -->
    <circle cx="0" cy="0" r="9" fill="#f0f6fc"/>
    <!-- middle ball -->
    <circle cx="0" cy="-9" r="7" fill="#f0f6fc"/>
    <!-- head -->
    <circle cx="0" cy="-18" r="5" fill="#f0f6fc"/>
    <!-- eyes -->
    <circle cx="-1.8" cy="-19" r="0.7" fill="#0a1018"/>
    <circle cx="1.8"  cy="-19" r="0.7" fill="#0a1018"/>
    <!-- carrot nose -->
    <path d="M0,-18 L4,-17.3 L0,-16.5 Z" fill="#f0883e"/>
    <!-- not letting him freeze here -->
    <rect x="-5" y="-14" width="10" height="2" rx="1" fill="#ff7b5a"/>
    <!-- buttons -->
    <circle cx="0" cy="-9" r="0.6" fill="#0a1018"/>
    <circle cx="0" cy="-5" r="0.6" fill="#0a1018"/>
    <!-- arms (sticks) -->
    <line x1="-7" y1="-9" x2="-13" y2="-13" stroke="#5a3a22" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="7"  y1="-9" x2="13"  y2="-13" stroke="#5a3a22" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <!-- left column -->
  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">351</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">127h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">346</text>
  </g>

  <!-- right column -->
  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>
