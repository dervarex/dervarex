<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f1f"/>
      <stop offset="60%" stop-color="#2d1a2e"/>
      <stop offset="100%" stop-color="#3d2038"/>
    </linearGradient>

    <!-- morning glow behind the title -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#d17e4e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d17e4e" stop-opacity="0"/>
    </radialGradient>

    <!-- sun -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>

    <!-- horizon glow above the hills -->
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a5a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff9a5a" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #ffb37a; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a89a; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a89a; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #ffd08a; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c9a89a; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #ffd08a; }
    .divider { stroke: #3d2436; stroke-width: 1; }
  </style>

  <!-- card background -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#ff9a5a" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- glow overlay -->
  <rect width="800" height="120" fill="url(#glow)"/>

  <!-- stars -->
  <circle cx="80"  cy="30" r="1" fill="#f5e6d8" opacity="0.4"/>
  <circle cx="180" cy="20" r="0.9" fill="#f5e6d8" opacity="0.35"/>
  <circle cx="560" cy="26" r="1.1" fill="#f5e6d8" opacity="0.4"/>
  <circle cx="660" cy="18" r="0.9" fill="#f5e6d8" opacity="0.3"/>
  <circle cx="740" cy="34" r="1" fill="#f5e6d8" opacity="0.35"/>

  <!-- sunrise -->
  <circle cx="700" cy="90" r="40" fill="url(#sun)"/>
  <circle cx="700" cy="90" r="16" fill="#ffd08a" opacity="0.85"/>

  <!-- birds on the left -->
  <path d="M140,60 Q145,56 150,60 Q155,56 160,60" stroke="#c9a89a" stroke-width="1.1" fill="none" opacity="0.55"/>
  <path d="M190,74 Q194,70 198,74 Q202,70 206,74" stroke="#c9a89a" stroke-width="1" fill="none" opacity="0.45"/>
  <path d="M110,82 Q114,78 118,82 Q122,78 126,82" stroke="#c9a89a" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- horizon glow just above the hills -->
  <rect x="0" y="212" width="800" height="28" fill="url(#horizon)"/>

  <!-- hills siluetthe  -->
  <path d="M0,232 Q100,222 200,228 T400,226 T600,230 T800,224 L800,240 L0,240 Z"
        fill="#1a0f1f" opacity="0.9"/>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <!-- left column -->
  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">383</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">129h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">378</text>
  </g>

  <!-- right column -->
  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>
