<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#28180f"/>
    </linearGradient>

    <!-- tiny warm glow behind the title -->
    <radialGradient id="glow" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#e07a3f" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#e07a3f" stop-opacity="0"/>
    </radialGradient>

    <!-- leaf shape -->
    <path id="leaf" d="M0,-6 C4,-4 6,0 4,4 C2,6 -2,6 -4,4 C-6,0 -4,-4 0,-6 Z" />
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #e8945a; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a789; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a789; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #d4a24c; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c9a789; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #d4a24c; }
    .divider { stroke: #3a2410; stroke-width: 1; }
  </style>

  <!-- card background -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#a0522d" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- glow overlay -->
  <rect width="800" height="120" fill="url(#glow)"/>

  <!-- scattered leaves -->
  <use href="#leaf" fill="#e07a3f" opacity="0.7" transform="translate(120 46) rotate(20)"/>
  <use href="#leaf" fill="#d4a24c" opacity="0.6" transform="translate(300 34) rotate(-30) scale(1.1)"/>
  <use href="#leaf" fill="#a0522d" opacity="0.6" transform="translate(500 50) rotate(40) scale(0.9)"/>
  <use href="#leaf" fill="#e07a3f" opacity="0.5" transform="translate(680 38) rotate(-15) scale(1.2)"/>
  <use href="#leaf" fill="#d4a24c" opacity="0.5" transform="translate(220 62) rotate(60) scale(0.8)"/>
  <use href="#leaf" fill="#a0522d" opacity="0.5" transform="translate(580 70) rotate(-45)"/>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <!-- left column -->
  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">356</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">127h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">351</text>
  </g>

  <!-- right column -->
  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>
