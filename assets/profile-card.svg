<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120a14"/>
      <stop offset="50%" stop-color="#1e1226"/>
      <stop offset="100%" stop-color="#0d0812"/>
    </linearGradient>

    <!-- spooky purple glow -->
    <radialGradient id="glow" cx="70%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0"/>
    </radialGradient>

    <!-- moooooooon -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8e0f0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#c47ae8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c47ae8" stop-opacity="0"/>
    </radialGradient>

    <!-- bat shape -->
    <path id="bat" d="M0,0 C-3,-4 -8,-6 -12,-4 C-10,-2 -8,0 -6,1 C-8,1 -10,2 -10,4 C-7,3 -4,2 0,3 C4,2 7,3 10,4 C10,2 8,1 6,1 C8,0 10,-2 12,-4 C8,-6 3,-4 0,0 Z" />

    <!-- tiny ghost -->
    <g id="ghost">
      <path d="M-6,5 C-6,-2 -3,-6 0,-6 C3,-6 6,-2 6,5 C6,7 5,8 4,7 C3,6 2,7 1,8 C0,9 -1,8 -2,7 C-3,6 -4,7 -5,8 C-6,9 -6,7 -6,5 Z" fill="#f4f0fa" opacity="0.95"/>
      <circle cx="-2" cy="-1" r="1.2" fill="#2a1a30"/>
      <circle cx="2" cy="-1" r="1.2" fill="#2a1a30"/>
      <ellipse cx="0" cy="2" rx="1.5" ry="1" fill="#2a1a30"/>
    </g>

    <!-- jack o lantern (looks scuffed but yeah) -->
    <g id="jack">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#f08a3f"/>
      <ellipse cx="-7" cy="0" rx="4" ry="8" fill="#d45a2a"/>
      <ellipse cx="7" cy="0" rx="4" ry="8" fill="#d45a2a"/>
      <path d="M-3,-8 L3,-8 L3,-10 L-3,-10 Z" fill="#5c8a3b"/>
      <path d="M-5,-2 L-2,-5 L1,-2 Z" fill="#1a0f1e"/>
      <path d="M5,-2 L2,-5 L-1,-2 Z" fill="#1a0f1e"/>
      <path d="M-4,3 L0,6 L4,3 Z" fill="#1a0f1e"/>
      <path d="M-4,3 L0,1 L4,3 Z" fill="#1a0f1e"/>
    </g>

    <!-- spider -->
    <g id="spider">
      <circle cx="0" cy="0" r="4" fill="#1a0f1e"/>
      <circle cx="0" cy="-5" r="2.5" fill="#1a0f1e"/>
      <line x1="0" y1="0" x2="-8" y2="-6" stroke="#1a0f1e" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="8" y2="-6" stroke="#1a0f1e" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-9" y2="2" stroke="#1a0f1e" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="9" y2="2" stroke="#1a0f1e" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="-7" y2="8" stroke="#1a0f1e" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="7" y2="8" stroke="#1a0f1e" stroke-width="1.2"/>
    </g>

    <!-- candy corn -->
    <g id="candy">
      <path d="M-4,6 L0,-6 L4,6 Z" fill="#f4e6d3"/>
      <path d="M-3,3 L0,-3 L3,3 Z" fill="#f08a3f"/>
      <path d="M-2,0 L0,-6 L2,0 Z" fill="#f4d03f"/>
    </g>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }
    .float { animation: float 3s ease-in-out infinite; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #d48ae8; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 0 10px rgba(155, 89, 182, 0.5); }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9b0d9; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9b0d9; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #f08a3f; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c9b0d9; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #f08a3f; }
    .divider { stroke: #4a3050; stroke-width: 1; }
  </style>

  <!-- the card -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#9b59b6" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- overlay the glow -->
  <rect width="800" height="240" fill="url(#glow)"/>

  <!-- mooooooon -->
  <circle cx="720" cy="40" r="40" fill="url(#moonGlow)" />
  <circle cx="720" cy="40" r="18" fill="#e8e0f0" opacity="0.4" />

  <!-- bats flying around -->
  <g fill="#1a0f1e">
    <use href="#bat" transform="translate(120 45) scale(1.3) rotate(-15)"/>
    <use href="#bat" transform="translate(280 35) scale(0.9) rotate(20)"/>
    <use href="#bat" transform="translate(510 55) scale(1.1) rotate(-30)"/>
    <use href="#bat" transform="translate(630 40) scale(1.4) rotate(10)"/>
    <use href="#bat" transform="translate(200 80) scale(0.8) rotate(45)"/>
    <use href="#bat" transform="translate(600 85) scale(1) rotate(-25)"/>
    <use href="#bat" transform="translate(400 70) scale(1.2) rotate(15)"/>
    <use href="#bat" transform="translate(60 110) scale(0.7) rotate(-40)"/>
    <use href="#bat" transform="translate(740 100) scale(0.9) rotate(30)"/>
    <use href="#bat" transform="translate(350 105) scale(0.6) rotate(-10)"/>
    <use href="#bat" transform="translate(480 115) scale(0.8) rotate(35)"/>
  </g>

  <!-- ghosts floating -->
  <g class="float">
    <use href="#ghost" transform="translate(160 130) scale(1.3)"/>
    <use href="#ghost" transform="translate(680 140) scale(1.1)"/>
    <use href="#ghost" transform="translate(420 150) scale(1)"/>
    <use href="#ghost" transform="translate(50 190) scale(0.9)"/>
    <use href="#ghost" transform="translate(760 200) scale(1.2)"/>
    <use href="#ghost" transform="translate(280 170) scale(0.8)"/>
    <use href="#ghost" transform="translate(550 160) scale(1.1)"/>
  </g>

  <!-- jack o lanterns -->
  <g>
    <use href="#jack" transform="translate(120 215) scale(1.2)"/>
    <use href="#jack" transform="translate(150 220) scale(0.8)"/>
    <use href="#jack" transform="translate(680 215) scale(1.3)"/>
    <use href="#jack" transform="translate(710 220) scale(0.9)"/>
    <use href="#jack" transform="translate(390 225) scale(1)"/>
    <use href="#jack" transform="translate(520 220) scale(0.8)"/>
    <use href="#jack" transform="translate(80 225) scale(0.7)"/>
    <use href="#jack" transform="translate(760 225) scale(0.8)"/>
  </g>

  <!-- spiders doing spider things -->
  <g>
    <use href="#spider" transform="translate(250 120) scale(1.3)"/>
    <use href="#spider" transform="translate(580 130) scale(1.1)"/>
    <use href="#spider" transform="translate(90 80) scale(1)"/>
    <use href="#spider" transform="translate(700 70) scale(1.2)"/>
    <use href="#spider" transform="translate(320 210) scale(0.9)"/>
    <use href="#spider" transform="translate(500 200) scale(1.1)"/>
    <use href="#spider" transform="translate(450 80) scale(0.8)"/>
  </g>

  <!-- candy corn scattered -->
  <g>
    <use href="#candy" transform="translate(220 200) scale(1.2) rotate(15)"/>
    <use href="#candy" transform="translate(240 205) scale(0.9) rotate(-20)"/>
    <use href="#candy" transform="translate(620 210) scale(1.1) rotate(10)"/>
    <use href="#candy" transform="translate(640 215) scale(0.8) rotate(-15)"/>
    <use href="#candy" transform="translate(340 220) scale(1) rotate(25)"/>
    <use href="#candy" transform="translate(470 215) scale(0.9) rotate(-10)"/>
    <use href="#candy" transform="translate(180 210) scale(0.7) rotate(30)"/>
    <use href="#candy" transform="translate(730 210) scale(0.8) rotate(-25)"/>
  </g>

  <!-- dust or smth -->
  <g opacity="0.6">
    <circle cx="150" cy="110" r="1.5" fill="#c47ae8" />
    <circle cx="650" cy="100" r="2" fill="#9b59b6" />
    <circle cx="380" cy="120" r="1" fill="#f08a3f" />
    <circle cx="490" cy="110" r="1.5" fill="#c47ae8" />
    <circle cx="750" cy="150" r="2" fill="#9b59b6" />
    <circle cx="40" cy="180" r="1.5" fill="#f08a3f" />
    <circle cx="280" cy="200" r="1" fill="#c47ae8" />
    <circle cx="560" cy="180" r="1.5" fill="#9b59b6" />
    <circle cx="120" cy="80" r="2" fill="#f08a3f" />
    <circle cx="680" cy="120" r="1" fill="#c47ae8" />
    <circle cx="320" cy="60" r="1.5" fill="#9b59b6" />
    <circle cx="580" cy="60" r="2" fill="#f08a3f" />
    <circle cx="420" cy="190" r="1.5" fill="#c47ae8" />
    <circle cx="220" cy="170" r="1" fill="#9b59b6" />
  </g>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">628</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">140h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">643</text>
  </g>

  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>