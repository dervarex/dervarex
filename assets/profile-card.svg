<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>

    <!-- soft blue glow behind the title -->
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* subtle twinkle for the stars */
    @keyframes twinkle {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.9; }
    }
    .star { animation: twinkle 4s ease-in-out infinite; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #58a6ff; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #8b949e; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #8b949e; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #58a6ff; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #8b949e; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #58a6ff; }
    .divider { stroke: #1f2937; stroke-width: 1; }
  </style>

  <!-- card background -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#1f6feb" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- glow overlay -->
  <rect width="800" height="120" fill="url(#glow)"/>

  <!-- starfield -->
  <circle class="star" cx="60"  cy="30" r="1.2" fill="#58a6ff" style="animation-delay: 0s"/>
  <circle class="star" cx="120" cy="40" r="1.0" fill="#58a6ff" style="animation-delay: 1.1s"/>
  <circle class="star" cx="180" cy="24" r="1.4" fill="#c9d1d9" style="animation-delay: 0.6s"/>
  <circle class="star" cx="240" cy="28" r="1.0" fill="#58a6ff" style="animation-delay: 2.0s"/>
  <circle class="star" cx="320" cy="18" r="1.3" fill="#c9d1d9" style="animation-delay: 1.5s"/>
  <circle class="star" cx="400" cy="26" r="1.0" fill="#58a6ff" style="animation-delay: 0.3s"/>
  <circle class="star" cx="480" cy="20" r="1.2" fill="#c9d1d9" style="animation-delay: 2.4s"/>
  <circle class="star" cx="560" cy="36" r="1.4" fill="#58a6ff" style="animation-delay: 1.8s"/>
  <circle class="star" cx="620" cy="22" r="1.0" fill="#c9d1d9" style="animation-delay: 0.9s"/>
  <circle class="star" cx="680" cy="52" r="1.2" fill="#58a6ff" style="animation-delay: 3.0s"/>
  <circle class="star" cx="720" cy="24" r="1.2" fill="#58a6ff" style="animation-delay: 1.2s"/>
  <circle class="star" cx="760" cy="48" r="1.0" fill="#c9d1d9" style="animation-delay: 2.6s"/>
  <circle class="star" cx="80"  cy="70" r="0.9" fill="#c9d1d9" style="animation-delay: 1.4s"/>
  <circle class="star" cx="200" cy="80" r="1.0" fill="#58a6ff" style="animation-delay: 3.4s"/>
  <circle class="star" cx="600" cy="78" r="0.9" fill="#58a6ff" style="animation-delay: 0.5s"/>
  <circle class="star" cx="740" cy="82" r="1.0" fill="#c9d1d9" style="animation-delay: 2.1s"/>
  <circle class="star" cx="40"  cy="100" r="0.8" fill="#58a6ff" style="animation-delay: 3.8s"/>
  <circle class="star" cx="770" cy="110" r="0.8" fill="#c9d1d9" style="animation-delay: 1.6s"/>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <!-- separator -->
  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <!-- left column -->
  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">358</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">127h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">355</text>
  </g>

  <!-- right column -->
  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>
