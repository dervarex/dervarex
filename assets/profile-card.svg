<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="50%" stop-color="#22140b"/>
      <stop offset="100%" stop-color="#28180f"/>
    </linearGradient>

    <!-- little campfire glow -->
    <radialGradient id="glow" cx="30%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#e07a3f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e07a3f" stop-opacity="0"/>
    </radialGradient>

    <!-- generic leaf, we're gonna use this a lot -->
    <path id="leaf" d="M0,-6 C4,-4 6,0 4,4 C2,6 -2,6 -4,4 C-6,0 -4,-4 0,-6 Z" />
    
    <!-- tiny berries -->
    <g id="berries">
      <circle cx="0" cy="0" r="3.5" fill="#a63a2b" />
      <circle cx="4" cy="-3" r="3" fill="#8c2e1f" />
      <circle cx="-3" cy="2" r="2.5" fill="#c44d3a" />
    </g>

    <!-- cute little mushroom -->
    <g id="mushroom">
      <rect x="-2" y="0" width="4" height="7" rx="2" fill="#e8d5b7"/>
      <path d="M-8,0 C-8,-7 8,-7 8,0 Z" fill="#c44d3a"/>
      <circle cx="-3" cy="-2" r="1.5" fill="#f4e6d3"/>
      <circle cx="3" cy="-1" r="1" fill="#f4e6d3"/>
    </g>

    <!-- pinecone for texture -->
    <g id="pinecone">
      <ellipse cx="0" cy="0" rx="5" ry="8" fill="#5c3a21"/>
      <path d="M-5,-4 Q0,-8 5,-4" stroke="#3b1f14" stroke-width="1" fill="none"/>
      <path d="M-6,0 Q0,-4 6,0" stroke="#3b1f14" stroke-width="1" fill="none"/>
      <path d="M-5,4 Q0,0 5,4" stroke="#3b1f14" stroke-width="1" fill="none"/>
    </g>

    <!-- tiny pumpkin -->
    <g id="pumpkin">
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#e87a3f"/>
      <ellipse cx="-6" cy="0" rx="4" ry="6" fill="#d45a2a"/>
      <ellipse cx="6" cy="0" rx="4" ry="6" fill="#d45a2a"/>
      <path d="M-2,-6 L2,-6 L2,-8 L-2,-8 Z" fill="#5c8a3b"/>
    </g>

    <!-- cozy mug because developers need coffee -->
    <g id="mug">
      <rect x="-10" y="0" width="20" height="15" rx="2" fill="#8c5a35"/>
      <path d="M10,3 Q15,3 15,8 Q15,13 10,13" stroke="#8c5a35" stroke-width="2" fill="none"/>
      <path d="M-5,-2 Q-5,-8 0,-8 Q5,-8 5,-2" stroke="#d4a24c" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M-2,-4 Q-2,-9 2,-9" stroke="#d4a24c" stroke-width="1" fill="none" opacity="0.4"/>
    </g>

    <!-- squirrel awww it's soo cute :3 -->
    <g id="squirrel">
      <path d="M-5,5 C-25,10 -35,-15 -15,-25 C-5,-30 5,-20 0,-10 C-5,0 -10,5 -5,5 Z" fill="#8c5a35"/>
      <path d="M-5,5 C-20,8 -28,-10 -15,-20 C-10,-23 -5,-20 -5,-15" stroke="#a0522d" stroke-width="1" fill="none"/>
      <ellipse cx="0" cy="0" rx="12" ry="10" fill="#c47844"/>
      <ellipse cx="3" cy="2" rx="7" ry="6" fill="#e8d5b7"/>
      <circle cx="12" cy="-6" r="9" fill="#c47844"/>
      <path d="M8,-14 L10,-20 L14,-14 Z" fill="#8c5a35"/>
      <circle cx="15" cy="-8" r="1.5" fill="#1a1008"/>
      <circle cx="20" cy="-5" r="1.5" fill="#1a1008"/>
      <ellipse cx="18" cy="4" rx="3" ry="4" fill="#b87b4a"/>
      <path d="M15,2 Q18,0 21,2 Z" fill="#6b4226"/>
      <path d="M14,2 C14,6 16,8 18,8" stroke="#c47844" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- wheat stalk, because why not -->
    <g id="wheat">
      <path d="M0,0 Q5,-10 0,-20" stroke="#c4a24c" stroke-width="1.5" fill="none"/>
      <ellipse cx="-3" cy="-5" rx="3" ry="1.5" fill="#d4a24c" transform="rotate(-30 -3 -5)"/>
      <ellipse cx="3" cy="-10" rx="3" ry="1.5" fill="#d4a24c" transform="rotate(30 3 -10)"/>
      <ellipse cx="-3" cy="-15" rx="3" ry="1.5" fill="#d4a24c" transform="rotate(-30 -3 -15)"/>
      <ellipse cx="2" cy="-20" rx="3" ry="1.5" fill="#d4a24c" transform="rotate(30 2 -20)"/>
    </g>
  </defs>

  <style>
    /* entry animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.9s ease-out forwards; opacity: 0; }
    .fade-in-up { animation: fadeInUp 0.9s ease-out forwards; opacity: 0; }

    /* typography */
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; fill: #e8945a; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a789; letter-spacing: 0.5px; }
    .stat-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #c9a789; }
    .stat-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #d4a24c; font-weight: 700; }
    .extra-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #c9a789; }
    .extra-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #d4a24c; }
    .divider { stroke: #3a2410; stroke-width: 1; }
  </style>

  <!-- the card -->
  <rect width="800" height="240" rx="14" fill="url(#bgGrad)" stroke="#a0522d" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- overlay the glow -->
  <rect width="800" height="120" fill="url(#glow)"/>

  <!-- leaves doing their thing, seriously there's a lot -->
  <g>
    <use href="#leaf" fill="#c45a2c" opacity="0.7" transform="translate(110 40) rotate(15)"/>
    <use href="#leaf" fill="#e88d4b" opacity="0.6" transform="translate(280 30) rotate(-25) scale(1.1)"/>
    <use href="#leaf" fill="#a63a2b" opacity="0.6" transform="translate(510 55) rotate(45) scale(0.9)"/>
    <use href="#leaf" fill="#e07a3f" opacity="0.5" transform="translate(690 35) rotate(-10) scale(1.2)"/>
    <use href="#leaf" fill="#d4a24c" opacity="0.6" transform="translate(200 70) rotate(70) scale(0.8)"/>
    <use href="#leaf" fill="#8c2e1f" opacity="0.5" transform="translate(600 75) rotate(-40)"/>
    <use href="#leaf" fill="#e8a86a" opacity="0.4" transform="translate(400 60) rotate(10) scale(1.3)"/>
    <use href="#leaf" fill="#c45a2c" opacity="0.5" transform="translate(60 100) rotate(-60) scale(0.7)"/>
    <use href="#leaf" fill="#d4a24c" opacity="0.4" transform="translate(740 90) rotate(80) scale(0.9)"/>
    <use href="#leaf" fill="#e07a3f" opacity="0.5" transform="translate(330 130) rotate(-15) scale(0.6)"/>
    <use href="#leaf" fill="#a63a2b" opacity="0.4" transform="translate(470 140) rotate(25) scale(0.7)"/>
    <use href="#leaf" fill="#d4a24c" opacity="0.5" transform="translate(150 190) rotate(-80) scale(0.8)"/>
    <use href="#leaf" fill="#e8a86a" opacity="0.4" transform="translate(260 160) rotate(50) scale(0.6)"/>
    <use href="#leaf" fill="#c45a2c" opacity="0.5" transform="translate(550 170) rotate(-60) scale(0.9)"/>
    <use href="#leaf" fill="#8c2e1f" opacity="0.4" transform="translate(670 150) rotate(15) scale(0.7)"/>
    <use href="#leaf" fill="#e07a3f" opacity="0.5" transform="translate(790 180) rotate(90) scale(0.8)"/>
    <use href="#leaf" fill="#d4a24c" opacity="0.4" transform="translate(20 60) rotate(30) scale(0.6)"/>
  </g>

  <!-- twigs and branches -->
  <g stroke="#4a2e1a" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M30 120 Q50 110 70 125 M50 115 Q55 105 65 100" />
    <path d="M750 80 Q770 70 790 85 M770 75 Q775 65 785 60" />
    <path d="M720 200 Q740 190 760 205 M740 195 Q745 185 755 180" />
    <path d="M120 220 Q140 210 160 225 M140 215 Q145 205 155 200" />
  </g>

  <!-- berries hanging around -->
  <use href="#berries" transform="translate(80 70) scale(1.2)"/>
  <use href="#berries" transform="translate(720 60) scale(1.1)"/>
  <use href="#berries" transform="translate(350 100) scale(0.8)"/>
  <use href="#berries" transform="translate(450 85) scale(0.9)"/>
  <use href="#berries" transform="translate(680 190) scale(1)"/>
  <use href="#berries" transform="translate(40 160) scale(0.7)"/>
  <use href="#berries" transform="translate(780 140) scale(1.3)"/>

  <!-- mushrooms popping up -->
  <use href="#mushroom" transform="translate(70 210) scale(1.1)"/>
  <use href="#mushroom" transform="translate(90 215) scale(0.8)"/>
  <use href="#mushroom" transform="translate(740 215) scale(1.2)"/>
  <use href="#mushroom" transform="translate(760 220) scale(0.9)"/>
  <use href="#mushroom" transform="translate(180 230) scale(0.7)"/>
  <use href="#mushroom" transform="translate(200 235) scale(0.5)"/>

  <!-- pinecones for  -->
  <use href="#pinecone" transform="translate(760 50) rotate(15)"/>
  <use href="#pinecone" transform="translate(40 140) rotate(-20)"/>
  <use href="#pinecone" transform="translate(680 200) rotate(45) scale(0.8)"/>
  <use href="#pinecone" transform="translate(140 50) rotate(10) scale(0.7)"/>

  <!-- pumpkins chillin' -->
  <use href="#pumpkin" transform="translate(150 220) scale(0.9)"/>
  <use href="#pumpkin" transform="translate(170 225) scale(0.6)"/>
  <use href="#pumpkin" transform="translate(690 230) scale(1.1)"/>
  <use href="#pumpkin" transform="translate(710 235) scale(0.7)"/>

  <!-- cozy mug, i don't drink coffee but it vibes with the rest -->
  <use href="#mug" transform="translate(450 220) scale(1.2)"/>

  <!-- squirrel sitting near the bottom right, holding a little acorn -->
  <use href="#squirrel" transform="translate(610 195) scale(1.1)"/>

  <!-- wheat stalks for that harvest vibe -->
  <use href="#wheat" transform="translate(50 180) rotate(-15)"/>
  <use href="#wheat" transform="translate(70 185) rotate(10)"/>
  <use href="#wheat" transform="translate(750 160) rotate(20)"/>
  <use href="#wheat" transform="translate(770 165) rotate(-10)"/>

  <!-- acorns and chestnuts -->
  <g transform="translate(55 180) rotate(15)">
    <ellipse cx="0" cy="4" rx="4.5" ry="6" fill="#b87b4a" />
    <path d="M-5,0 Q0,-5 5,0 Q0,-2 -5,0 Z" fill="#6b4226" />
    <rect x="-1" y="-5" width="2" height="3" rx="1" fill="#4a2e1a" />
  </g>
  <g transform="translate(745 130) rotate(-25)">
    <ellipse cx="0" cy="4" rx="5" ry="6.5" fill="#b87b4a" />
    <path d="M-6,0 Q0,-6 6,0 Q0,-2 -6,0 Z" fill="#6b4226" />
    <rect x="-1" y="-6" width="2" height="4" rx="1" fill="#4a2e1a" />
  </g>
  <g transform="translate(180 200) rotate(60)">
    <ellipse cx="0" cy="3" rx="4" ry="5.5" fill="#8c5a35" />
    <path d="M-4,0 Q0,-4 4,0 Q0,-1 -4,0 Z" fill="#4a2e1a" />
  </g>
  <g transform="translate(620 220) rotate(-40)">
    <ellipse cx="0" cy="3" rx="4" ry="5.5" fill="#8c5a35" />
    <path d="M-4,0 Q0,-4 4,0 Q0,-1 -4,0 Z" fill="#4a2e1a" />
  </g>

  <g opacity="0.5">
    <circle cx="150" cy="110" r="1.5" fill="#e8a86a" />
    <circle cx="650" cy="100" r="2" fill="#d68b4a" />
    <circle cx="380" cy="120" r="1" fill="#e07a3f" />
    <circle cx="490" cy="110" r="1.5" fill="#c46a2b" />
    <circle cx="750" cy="150" r="2" fill="#e8a86a" />
    <circle cx="40" cy="180" r="1.5" fill="#d4a24c" />
    <circle cx="280" cy="200" r="1" fill="#e07a3f" />
    <circle cx="560" cy="180" r="1.5" fill="#d4a24c" />
    <circle cx="120" cy="80" r="2" fill="#c45a2c" />
    <circle cx="680" cy="120" r="1" fill="#e88d4b" />
    <circle cx="320" cy="60" r="1.5" fill="#a63a2b" />
    <circle cx="580" cy="60" r="2" fill="#d4a24c" />
  </g>

  <g stroke="#c9a789" stroke-width="1" opacity="0.15">
    <line x1="100" y1="120" x2="95" y2="140" />
    <line x1="300" y1="130" x2="295" y2="150" />
    <line x1="500" y1="110" x2="495" y2="130" />
    <line x1="700" y1="140" x2="695" y2="160" />
    <line x1="200" y1="150" x2="195" y2="170" />
    <line x1="600" y1="120" x2="595" y2="140" />
    <line x1="400" y1="160" x2="395" y2="180" />
    <line x1="800" y1="130" x2="795" y2="150" />
    <line x1="50" y1="160" x2="45" y2="180" />
  </g>

  <!-- header -->
  <text x="400" y="48" text-anchor="middle" class="title fade-in">Hey, I'm dervarex</text>
  <text x="400" y="72" text-anchor="middle" class="subtitle fade-in">Developer from Germany</text>

  <line x1="60" y1="90" x2="740" y2="90" class="divider fade-in"/>

  <g class="fade-in-up">
    <text x="100" y="120" class="stat-label">Total Stars Earned:</text>
    <text x="300" y="120" class="stat-value">1</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="150" class="stat-label">Total Commits:</text>
    <text x="300" y="150" class="stat-value">472</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="180" class="stat-label">Coding Time:</text>
    <text x="300" y="180" class="stat-value">124h</text>
  </g>
  <g class="fade-in-up">
    <text x="100" y="210" class="stat-label">Contributions (2026):</text>
    <text x="300" y="210" class="stat-value">465</text>
  </g>

  <g class="fade-in-up">
    <text x="450" y="120" class="extra-label">Currently working on:</text>
    <text x="450" y="140" class="extra-value">Minified</text>
  </g>
  <g class="fade-in-up">
    <text x="450" y="165" class="extra-label">Tech Stack:</text>
    <text x="450" y="185" class="extra-value">Java, Git, Linux</text>
  </g>
</svg>