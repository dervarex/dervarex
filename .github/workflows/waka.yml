name: Update Ziit Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from Ziit
        env:
          ZIIT_URL: ${{ secrets.ZIIT_URL }}
          ZIIT_KEY: ${{ secrets.ZIIT_KEY }}
        run: |
          curl -s "$ZIIT_URL/api/stats?timeRange=all-time" \
            -H "Authorization: Bearer $ZIIT_KEY" \
            -o stats.json
          cat stats.json

      - name: Update README
        env:
          ZIIT_URL: ${{ secrets.ZIIT_URL }}
          ZIIT_KEY: ${{ secrets.ZIIT_KEY }}
        run: |
          python3 .github/scripts/update_readme.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Ziit stats"
          git push